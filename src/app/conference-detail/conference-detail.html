@if (current(); as c) {
  <section class="detail">
    <h2>{{ c.titre }}</h2>
    <p>Intervenant : {{ c.intervenant }}</p>
    <p>Sujet : {{ c.sujet }}</p>
    <p>Date : {{ c.date | date: 'dd/MM/yyyy' }}</p>
    <p>Places restantes : {{ c.places }}</p>

    @if (estReservee()) {
      <button class="annuler" (click)="annuler()">Annuler la réservation</button>
    } @else if (c.places === 0) {
      <button disabled>Complet</button>
    } @else {
      <button (click)="inscrire()">Réserver</button>
    }
  </section>
}
